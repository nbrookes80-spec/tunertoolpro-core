[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tunertoolpro-core"
version = "0.1.0"
description = "Shared core of TunerToolPro: GM transmission calibration maths, file formats, vehicle data and CAN tools"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
logs = ["pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["tunertoolpro*"]
